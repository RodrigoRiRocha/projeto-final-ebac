{% extends 'social/base.html' %}
{% block title %}Início | Chirp{% endblock %}
{% block page %}home{% endblock %}
{% block content %}
<header class="page-header feed-header"><h1>Início</h1><button class="text-button" id="refresh-feed">Atualizar</button></header>
<section class="composer" id="composer-locked"><p>Entre para participar da conversa.</p><button data-open-auth>Entrar</button></section>
<form class="composer" id="post-form" hidden>
  <div class="composer-avatar">@</div>
  <label class="sr-only">O que está acontecendo?</label>
  <textarea name="content" maxlength="280" placeholder="O que está acontecendo?" required></textarea>
  <div class="composer-footer"><span id="character-count">0 / 280</span><button>Publicar</button></div>
  <p class="form-message" id="post-message" aria-live="polite"></p>
</form>
<section class="section-heading"><h2 id="timeline-title">Timeline</h2></section>
<div id="feed" class="timeline"><p class="empty">Carregando postagens...</p></div>
{% endblock %}
